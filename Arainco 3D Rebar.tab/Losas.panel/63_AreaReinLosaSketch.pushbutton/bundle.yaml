title: "Malla por\nPaño de losa"
tooltip: >
  Solo en vistas de planta. Selecciona una losa o losa de cimentación
  (Structural Foundation slab), dibuja paños con 2 puntos en el canvas
  (rectángulo) y crea AreaReinforcement por paño (capas superior/inferior
  Major/Minor). Opción «Ahorro de fierro»: dos series intercaladas @ 2×e
  con recorte ~10% en extremos opuestos.
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
