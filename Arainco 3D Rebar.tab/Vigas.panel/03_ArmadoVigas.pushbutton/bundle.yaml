title: "Armado\nVigas"
tooltip: >
  Armado de vigas: selección de lote (vigas, columnas, muros de hormigón),
  alzado y sección, pestañas SUP / INF / LAT / CONF y tarjeta SUPLE.
  Coloca Rebar longitudinal, estribos y laterales según toggles del rail.
