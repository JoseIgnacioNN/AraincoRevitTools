title: "Unir Geom.\nHormigón"
tooltip: >
  Une geometría (Join) solo entre pares de elementos cuyo material estructural sea
  hormigón (Concrete), y solo entre ejemplares presentes en la vista activa.
  Antes de unir, aplica Detach All a muros con attachment a losa. Usa solape de
  cajas para proponer pares; se ejecuta en un único deshacer.
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
