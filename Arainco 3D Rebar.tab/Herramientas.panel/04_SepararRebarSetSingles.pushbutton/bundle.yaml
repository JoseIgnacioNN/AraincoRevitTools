title: "Set To\nSingle"
tooltip: >
  To Single: convierte uno o más Rebar con layout distinto de Single en barras
  Single. Multiselección (clic / Ctrl+clic para quitar). Hereda geometría y
  parámetros Armadura_*. Si Armadura_Malla=Yes, reaplica la etiqueta del set en
  una sola barra (cabeza en centroide del muro host).
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
