title: "Seleccionar\nCapa"
tooltip: >
  Selecciona barras (Rebar) y Detail Items de la misma capa (Armadura_Capa)
  que compartan el mismo GUID de creación (Armadura_Conjunto_GUID), a partir
  de una barra o empalme de referencia. Incluye las etiquetas de armadura
  hosteadas en esas barras en la vista activa.
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
