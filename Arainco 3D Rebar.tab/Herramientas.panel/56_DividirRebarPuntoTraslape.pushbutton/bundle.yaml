title: "Dividir barra\ntraslape"
tooltip: >
  Al ejecutar, pide seleccionar una Structural Rebar y abre la UI multipunto:
  esquema canvas (clic añade/quita cortes), edición de vanos y traslape según
  diámetro (tabla BIMTools base / G25 / G35 / G45). Genera N+1 tramos con solape.
  Barras Single, Fixed Number o Maximum Spacing con tramos rectos. Hereda
  Armadura_*, Unobscured, PresentationMode (Show Middle / FirstLast / …)
  y etiquetas (familia original, RebarShape).
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
