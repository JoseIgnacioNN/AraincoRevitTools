title: "Cota de\nElevación"
tooltip: >
  En Sección o Alzado: seleccione dos o más losas, indique la posición de la
  cota y genera una cota alineada entre caras superiores horizontales más
  Spot Elevations. Aplica el tipo «Survey Point_Nivel Tope de Losa» si existe
  en el proyecto. Los elementos se ocultan en el resto del árbol de vistas
  dependientes (visibles solo en la vista activa).


  Funcional en Revit 2024, 2025, 2026.
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
