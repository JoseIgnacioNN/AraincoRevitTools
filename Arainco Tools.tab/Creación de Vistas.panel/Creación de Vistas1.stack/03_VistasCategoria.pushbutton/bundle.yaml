title: "Vistas por categoría"
tooltip: >
  Crea conjuntos de vistas de entregable (01_ENTREGABLE) para una o varias
  categorías y la zona seleccionada: plantas estructurales Cielo y Piso por
  nivel, plantillas de vista y tipos Detail / Building Section.


  Equivalente Python del botón Dynamo «Vistas Categoría» (AraincoRevitTools).
  Requiere tipos «Structural Plan (Cielo/Piso)» y plantillas maestras en el
  proyecto.


  Funcional en Revit 2024, 2025, 2026.
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
