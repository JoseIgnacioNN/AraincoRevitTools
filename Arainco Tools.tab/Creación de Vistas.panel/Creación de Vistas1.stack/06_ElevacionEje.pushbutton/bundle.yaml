title: "Elevación\nEje"
tooltip: >
  Solo en vistas de planta. Lee «Section Filter» de la planta activa para
  elegir el tipo Building Section (nombre que contenga ese valor). Crea
  una sección por cada eje marcado, con la escala elegida. Aplica un filtro
  Armadura_Eje por vista y hereda los filtros de la plantilla; si la plantilla
  rige los filtros, la edita para permitir un filtro distinto en cada elevación.
  El Detail Level de las vistas es Coarse (se verifica y corrige en la plantilla).
author: "José Ignacio Núñez"
min_revit_ver: 2024
max_revit_ver: 2026
